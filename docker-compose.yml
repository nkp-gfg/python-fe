version: "3.8"

services:
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: falconeye_mongodb
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: falconeye_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  flower:
    image: mher/flower:2.0
    container_name: falconeye_flower
    # Flower 2.0 splits FLOWER_BASIC_AUTH on commas and accepts an empty entry
    # as a valid login, so refuse to start unless every entry is user:password.
    entrypoint:
      - /bin/sh
      - -c
      - |
        case ",$$FLOWER_BASIC_AUTH," in
          *,,*) echo "FLOWER_BASIC_AUTH must not contain an empty entry" >&2; exit 1 ;;
        esac
        IFS=,
        for credential in $$FLOWER_BASIC_AUTH; do
          case "$$credential" in
            ?*:?*) ;;
            *) echo "FLOWER_BASIC_AUTH entries must be user:password" >&2; exit 1 ;;
          esac
        done
        unset IFS
        exec "$$@"
      - flower-entrypoint
    command: ["celery", "flower"]
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # user:password, set in the untracked .env file next to this one.
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:?}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
